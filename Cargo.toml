[package]
name = "fileconverter"
version = "2.0.0"
edition = "2021"
description = "Convert and compress audio, video, image and document files"
license = "MIT"

[[bin]]
name = "fileconverter"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "6"
eframe = "0.31"
egui = "0.31"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
